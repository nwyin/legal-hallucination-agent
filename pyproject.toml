[project]
name = "legal-hallucination-agent"
version = "0.1.0"
description = "Benchmark agent for checking citations, quotes, and holdings in legal briefs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "backoff==2.2.1",
    "hydra-core==1.3.2",
    "langfuse==4.15.1",
    "omegaconf==2.3.0",
    "openai==1.109.1",
    "pydantic==2.12.5",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "requests==2.32.4",
    "requests-cache==1.2.1",
    "tqdm==4.67.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PIE"]
# The formatter handles code layout; do not reflow model-facing prompt strings.
ignore = ["E501"]
# En dashes are intentional in existing prompts and prose.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Credentials must be set before instrumented imports.
"benchmark_agent/tracing.py" = ["E402"]
